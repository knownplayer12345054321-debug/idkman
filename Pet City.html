<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Pet City</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style id="app-style">
/* Layout: single mobile column (max 640px), sticky top bar with slide-out half-width menu, dark grey surfaces, rarity-colored outlines. */
:root{--bg:#1c1d21;--panel:#26272c;--panel2:#2f3036;--fg:#ececef;--line:#5d5f68;--muted:#9a9ca6;--accent:#6a5cff;--accent-fg:#fff;--good:#3ecf6e;--bad:#ef4444;
--godly:#ff4d4d;--legendary:#ffd23f;--epic:#a855f7;--rare:#6ec6ff;--uncommon:#7ee08a;--common:#c6c9d1;
--display:"Baloo 2","Trebuchet MS",system-ui,sans-serif;--body:"DM Sans",system-ui,-apple-system,sans-serif;color-scheme:dark}
*{box-sizing:border-box}
html,body{background:var(--bg)}
body{margin:0;color:var(--fg);font:15px/1.45 var(--body);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0;min-height:100%;-webkit-tap-highlight-color:transparent}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:60}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{max-width:640px;margin:0 auto;min-width:0}
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:50;background:var(--bg);display:flex;align-items:center;gap:12px;padding:10px 0}
.burger{width:44px;height:40px;border-radius:12px;border:1.5px solid var(--line);background:var(--panel);display:grid;place-items:center;position:relative;z-index:56;flex:none}
.burger i{position:absolute;width:20px;height:2.5px;border-radius:2px;background:var(--fg);transition:transform .25s,opacity .2s}
.burger i:nth-child(1){transform:translateY(-6px)}.burger i:nth-child(3){transform:translateY(6px)}
.burger.open i:nth-child(1){transform:rotate(45deg)}.burger.open i:nth-child(2){opacity:0}.burger.open i:nth-child(3){transform:rotate(-45deg)}
.brand{font:700 20px var(--display);letter-spacing:.2px}
.menu{position:fixed;z-index:55;left:0;top:0;bottom:0;width:50%;min-width:190px;max-width:300px;background:var(--panel);border-right:1.5px solid var(--line);padding:calc(env(safe-area-inset-top,0px) + 68px) 14px 20px max(14px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:10px;transform:translateX(-102%);transition:transform .28s ease;visibility:hidden}
.menu.open{transform:none;visibility:visible}
.mclose{position:absolute;right:12px;top:calc(env(safe-area-inset-top,0px) + 12px);width:40px;height:40px;font-size:18px}
.here{font:600 11px var(--body);letter-spacing:.08em;text-transform:uppercase;color:var(--muted);display:flex;align-items:center;gap:8px;margin-bottom:4px}
.here b{font:700 12px var(--display);letter-spacing:.02em;text-transform:none;color:var(--fg);background:var(--panel2);border:1.5px solid var(--line);border-radius:999px;padding:1px 10px}
.mbtn{width:100%;text-align:left;border:1.5px solid var(--line);background:transparent;border-radius:12px;padding:10px 12px;font:600 15px var(--display)}
.mbtn.cur{background:var(--accent);border-color:var(--accent);color:var(--accent-fg);cursor:default}
h1{font:800 30px/1.1 var(--display);text-align:center;margin:18px 0 14px;text-wrap:balance}
h2{font:700 20px var(--display);text-align:center;margin:22px 0 10px}
.lead{text-align:center;color:var(--fg);max-width:46ch;margin:0 auto 18px}
.box{background:var(--panel);border:1.5px solid var(--line);border-radius:16px;padding:14px}
.big{display:block;width:92%;margin:0 auto 10px;border:1.5px solid var(--line);background:var(--panel2);border-radius:14px;padding:14px;font:700 18px var(--display);text-align:center}
.big:last-child{margin-bottom:0}
.big:hover{border-color:var(--accent)}
.info{text-align:center;display:block;color:inherit;text-decoration:none;margin-bottom:12px}
.info h3{font:700 18px var(--display);margin:0 0 4px}
.info p{margin:0;color:var(--fg);overflow-wrap:anywhere}
.info.link{cursor:pointer}.info.link:hover{border-color:var(--accent)}
.seg{display:inline-flex;border:1.5px solid var(--line);border-radius:12px;padding:3px;gap:2px;background:var(--panel);max-width:100%;overflow-x:auto}
.seg button{border:0;background:transparent;border-radius:9px;padding:5px 10px;font:700 12px var(--display);color:var(--muted);white-space:nowrap}
.seg button.on{background:var(--accent);color:var(--accent-fg)}
.chip{border:1.5px solid var(--line);background:var(--panel);border-radius:10px;padding:5px 11px;font:600 13px var(--body)}
.chip.on{background:#fff;color:#18181b;border-color:#fff}
.search{display:flex;align-items:center;gap:8px;background:#121316;border:1.5px solid var(--line);border-radius:14px;padding:0 12px}
.search input{flex:1;min-width:0;background:transparent;border:0;color:var(--fg);font:600 15px var(--body);padding:12px 0}
.search input:focus-visible{outline:none}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.filters{display:flex;flex-wrap:wrap;gap:8px;padding:12px;margin-top:10px}
.gear{border:1.5px solid var(--line);background:var(--panel2);border-radius:10px;width:38px;height:38px;display:grid;place-items:center;font-size:18px}
/* calculator */
.calc{padding:14px}
.verdict{text-align:center;font:800 24px var(--display);letter-spacing:.04em;margin:0 0 6px}
.tot{display:flex;justify-content:space-between;align-items:center;border-radius:12px;padding:6px 12px;font:700 15px var(--display);color:#fff;border:2px solid rgba(0,0,0,.25);font-variant-numeric:tabular-nums}
.tot.win{background:var(--good)}.tot.lose{background:var(--bad)}.tot.fair{background:var(--panel2);color:var(--fg);border-color:var(--line)}
.sides{display:grid;grid-template-columns:1fr 34px 1fr;gap:8px;margin-top:14px;align-items:start}
.sides h3{font:800 17px var(--display);margin:0 0 6px;letter-spacing:.02em}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:5px;background:#16171a;border:1.5px solid var(--line);border-radius:12px;padding:5px}
.slot{aspect-ratio:1;border-radius:9px;background:var(--panel2);border:1.5px solid var(--line);position:relative;display:grid;place-items:center;overflow:hidden;padding:0;min-width:0}
.slot img{width:100%;height:100%;object-fit:contain}
.slot .q{position:absolute;right:2px;bottom:2px;font:700 10px var(--display);background:#000a;border-radius:6px;padding:0 4px}
.slot .tg{position:absolute;left:2px;top:2px;display:flex;gap:1px;flex-wrap:wrap;max-width:90%}
.plus{background:var(--accent);border-color:transparent;color:#fff;font:700 28px/1 var(--display)}
.swap{align-self:center;margin-top:30px;width:34px;height:34px;border-radius:50%;border:1.5px solid var(--line);background:var(--panel2);display:grid;place-items:center;padding:0;font-size:17px}
.tag{font:800 8px/1 var(--display);width:12px;height:12px;border-radius:50%;display:grid;place-items:center;color:#fff}
.t-F{background:#2aa8ff}.t-R{background:#ff3d9a}.t-G{background:#9b5cff}.t-N{background:#7a7d88}.t-S{background:#ffd23f;color:#222}.t-Z{background:linear-gradient(135deg,#ff4d4d,#ffd23f,#3ecf6e,#2aa8ff,#a855f7)}
.dm{font:600 8px var(--body);color:#fff;background:#000a;position:absolute;left:0;right:0;bottom:0;text-align:center;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
/* modals */
.ov{position:fixed;inset:0;z-index:70;background:rgba(0,0,0,.6);display:grid;place-items:center;padding:16px}
.mod{width:100%;max-width:440px;max-height:90vh;overflow:auto;background:var(--panel);border:1.5px solid var(--line);border-radius:18px;padding:16px;position:relative}
.mod h3{font:700 19px var(--display);margin:0 0 12px;text-align:center}
.x{border:0;background:var(--bad);color:#fff;border-radius:9px;width:34px;height:34px;font:700 16px var(--display);flex:none}
.shop{display:grid;grid-template-columns:96px 1fr;gap:10px;margin-top:12px}
.cats{display:flex;flex-direction:column;gap:6px}
.cats button{border:1.5px solid var(--line);background:var(--panel2);border-radius:10px;padding:8px 6px;font:700 12px var(--display);text-align:left}
.cats button.on{background:var(--accent);border-color:var(--accent);color:#fff}
.pick{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;align-content:start}
.pk{aspect-ratio:1;border:2px solid var(--line);border-radius:10px;background:var(--panel2);padding:0;overflow:hidden;position:relative;display:grid;place-items:center;min-width:0}
.pk img{width:100%;height:100%;object-fit:contain}
.pk span{position:absolute;bottom:0;left:0;right:0;background:#000b;font:600 9px var(--body);padding:1px 2px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
#agrid{max-height:min(56vh,420px);overflow-y:auto;min-width:0}
.pager{display:flex;justify-content:center;align-items:center;gap:12px;margin-top:10px;font:700 14px var(--display)}
.pager button{border:1.5px solid var(--line);background:var(--panel2);border-radius:9px;width:34px;height:30px}
.types{display:flex;gap:8px;justify-content:center;margin:10px 0;flex-wrap:wrap}
.types button{width:42px;height:42px;border-radius:50%;border:2px solid transparent;font:800 17px var(--display);color:#fff;opacity:.4}
.types button.on{opacity:1;border-color:#fff}
.types .t-S{color:#222}
.btn{border:0;background:var(--accent);color:#fff;border-radius:12px;padding:10px 18px;font:700 15px var(--display)}
.btn.alt{background:var(--panel2);border:1.5px solid var(--line)}
.btn[disabled]{opacity:.45;cursor:default}
.qty{width:70px;text-align:center;border-radius:10px;border:1.5px solid var(--line);background:#fff;color:#111;font:700 16px var(--display);padding:6px}
.sw{display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-top:1px solid var(--line);font:700 15px var(--display)}
.tgl{width:48px;height:28px;border-radius:999px;border:0;background:#55575f;position:relative;padding:0}
.tgl::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;transition:transform .2s}
.tgl.on{background:var(--good)}.tgl.on::after{transform:translateX(20px)}
/* value list */
.sec-note{text-align:center;color:var(--muted);font-size:13px;margin:0 0 6px}
.cards{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}
.card{height:214px;border:2px solid var(--common);background:var(--panel);border-radius:12px;position:relative;padding:5px;display:flex;flex-direction:column;gap:3px;min-width:0;overflow:hidden}
.card.Godly{border-color:var(--godly)}.card.Legendary{border-color:var(--legendary)}.card.Epic{border-color:var(--epic)}.card.Rare{border-color:var(--rare)}.card.Uncommon{border-color:var(--uncommon)}.card.Common{border-color:var(--common)}
.pk.Godly{border-color:var(--godly)}.pk.Legendary{border-color:var(--legendary)}.pk.Epic{border-color:var(--epic)}.pk.Rare{border-color:var(--rare)}.pk.Uncommon{border-color:var(--uncommon)}.pk.Common{border-color:var(--common)}
.card .im{height:56px;display:grid;place-items:center;overflow:hidden;border-radius:8px;background:#16171a}
.card .im img{width:100%;height:100%;object-fit:contain}
.card .nm{font:700 11px/1.15 var(--display);text-align:center;min-height:26px;overflow:hidden;overflow-wrap:anywhere}
.card .vl{font:500 9.5px/1.2 var(--body);text-align:center;min-height:12px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.mini{display:grid;grid-template-columns:1fr 1fr;gap:3px;margin-top:auto}
.mini button{border:1px solid var(--line);background:transparent;border-radius:6px;padding:3px 0;font:700 8.5px var(--display);color:var(--muted);min-width:0}
.mini button.on{background:var(--fg);color:#17171a;border-color:var(--fg)}
.trash{position:absolute;right:3px;top:3px;width:20px;height:20px;border-radius:6px;border:0;background:var(--bad);color:#fff;font-size:11px;padding:0;z-index:2}
.card.add{border-style:dashed;border-color:var(--line);color:var(--muted);align-items:center;justify-content:center;font:300 60px/1 var(--display);cursor:pointer}
.card.dev{cursor:pointer}
/* dev */
.devbar{position:fixed;z-index:65;left:0;right:0;bottom:0;background:#121316;border-top:1.5px solid var(--accent);padding:8px max(16px,env(safe-area-inset-right,0px)) calc(8px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));display:flex;gap:8px;align-items:center;flex-wrap:wrap;justify-content:center}
.devbar .btn{padding:7px 12px;font-size:13px}
.devbar small{color:var(--muted)}
.f{display:flex;flex-direction:column;gap:4px;margin-bottom:10px}
.f label{font:700 12px var(--display);color:var(--muted);letter-spacing:.04em;text-transform:uppercase}
.f input,.f select,.f textarea{background:#121316;color:var(--fg);border:1.5px solid var(--line);border-radius:10px;padding:9px 10px;font:500 15px var(--body);width:100%;min-width:0}
.f textarea{min-height:76px;resize:vertical}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.three{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.acts{display:flex;gap:10px;justify-content:flex-end;margin-top:6px}
.toast{position:fixed;z-index:90;left:50%;transform:translateX(-50%);bottom:calc(70px + env(safe-area-inset-bottom,0px));background:#000d;color:#fff;border-radius:12px;padding:8px 14px;font-size:13px;max-width:90%}
.spacer{height:90px}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<script id="app-script">
(function(){
var CATS=['Pets','Eggs','Food','Vehicles','Items','Gifts','Houses'];
var RARS=['Godly','Legendary','Epic','Rare','Uncommon','Common'];
var MODES=[['b','Baseless'],['g','Gems'],['h','Hex']];
var TYPES=[['F','F'],['R','R'],['G','G'],['N','N'],['S','S'],['Z','R']];
var DISCORD='https://discord.gg/petcity';
var GAME='https://www.roblox.com/share?code=8e99c4c7aeb86542a91ab079b9d69442&type=ExperienceDetails&stamp=1792617277486';
var PAGES=[['calculator','Calculator'],['value-list','Value List'],['details','Details'],['support','Support']];
var PAGE_TITLES={home:'Home','calculator':'Calculator','value-list':'Value List',details:'Details',support:'Support'};
var root=document.getElementById('root');
var published=JSON.parse(document.getElementById('app-data').textContent);
var data=migrate(published);
var isOwner=false, preview=false, dirty=false;
var page='home', menuOpen=false;
var st={mode:'b',def:{F:true,R:true,G:false,N:true,S:false,Z:false},demand:true};
var calc={you:[],them:[]};
var vl={q:'',filters:false,cat:'All Categories',rar:'All'};
var sel={}; // card variant selections
var modal=null, toastTimer=null;

function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function ls(k,v){try{if(v===undefined){var r=localStorage.getItem(k);return r?JSON.parse(r):null}if(v===null)localStorage.removeItem(k);else localStorage.setItem(k,JSON.stringify(v))}catch(e){return null}}
function uid(){return 'i'+Math.random().toString(36).slice(2,9)}
function vk(k,g,f,r){return k+(g?'G':'')+(f?'F':'')+(r?'R':'')}
function pickKind(o,k){var on=!o[k]||k==='N';o.N=o.S=o.Z=false;if(k==='N'||!on)o.N=true;else o[k]=true}
function kindOf(t){return t.S?'S':t.Z?'Z':'N'}
function used(side){var n=0;calc[side].forEach(function(e){if(item(e.id))n+=e.q});return n}
function migrate(d){(d.items||[]).forEach(function(it){var v=it.v||{},o={};Object.keys(v).forEach(function(k){o[k[0]==='G'?'N'+k:k]=v[k]});it.v=o});return d}
function item(id){for(var i=0;i<data.items.length;i++)if(data.items[i].id===id)return data.items[i];return null}
function variant(it,key){return (it.v&&it.v[key])||{}}
function mult(m){var x=parseFloat((data.mult||{})[m]);return isNaN(x)?1:x}
function valueOf(it,key,mode){var n=parseFloat(variant(it,key).b);return isNaN(n)?0:n*mult(mode)}
function shownValue(it,key,mode){var n=parseFloat(variant(it,key).b);return isNaN(n)?'':fmt(n*mult(mode))}
function fmt(n){return (Math.round(n*1000)/1000).toLocaleString(undefined,{maximumFractionDigits:3})}
function sorted(list){return list.slice().sort(function(a,b){var d=RARS.indexOf(a.rar)-RARS.indexOf(b.rar);return d||String(a.name).localeCompare(String(b.name))})}
function devOn(){return isOwner&&!preview}
function toast(m){var t=document.getElementById('toast');if(!t){t=document.createElement('div');t.id='toast';t.className='toast';document.body.appendChild(t)}t.textContent=m;t.hidden=false;clearTimeout(toastTimer);toastTimer=setTimeout(function(){t.hidden=true},2600)}
function touch(){dirty=true;ls('pc-draft',data)}
function tagsHtml(t){var h='';TYPES.forEach(function(x){if(t[x[0]])h+='<span class="tag t-'+x[0]+'">'+x[1]+'</span>'});return h}
function imgHtml(it){return it.img?'<img alt="'+esc(it.name)+'" src="'+esc(it.img)+'">':'<span style="font:700 18px var(--display);color:var(--muted)">'+esc((it.name||'?').charAt(0).toUpperCase())+'</span>'}

/* ---------- shell ---------- */
function render(){
  var cur=PAGE_TITLES[page];
  var h='<div class="wrap"><div class="bar"><button class="burger'+(menuOpen?' open':'')+'" data-a="menu" aria-label="'+(menuOpen?'Close menu':'Open menu')+'"><i></i><i></i><i></i></button><span class="brand">Pet City</span></div>'
   +'<div class="menu'+(menuOpen?' open':'')+'" id="menu"><button class="x mclose" data-a="menu" aria-label="Close menu">✕</button><div class="here">You are on <b>'+esc(cur)+'</b></div>'
   +'<button class="mbtn'+(page==='home'?' cur':'')+'" data-a="go" data-p="home">Home</button>'
   +PAGES.map(function(p){return '<button class="mbtn'+(page===p[0]?' cur':'')+'" data-a="go" data-p="'+p[0]+'">'+p[1]+'</button>'}).join('')+'</div>'
   +'<div id="view">'+view()+'</div>'+(isOwner?'<div class="spacer"></div>':'<div style="height:30px"></div>')+'</div>'
   +'<div id="modal">'+modalHtml()+'</div>'+devbar();
  root.innerHTML=h;
}
function devbar(){
  if(!isOwner)return '';
  return '<div class="devbar"><button class="btn alt" data-a="preview">'+(preview?'Back to developer mode':'Preview as visitor')+'</button>'
   +(preview?'<small>Visitor view</small>':'<button class="btn" data-a="publish"'+(dirty?'':' disabled')+'>Publish changes</button>'+(dirty?'<button class="btn alt" data-a="discard">Discard</button>':'')+'<small>'+(dirty?'Unpublished edits':'Developer mode')+'</small>')+'</div>';
}
function view(){
  if(page==='home')return home();
  if(page==='calculator')return calculator();
  if(page==='value-list')return valueList();
  if(page==='details')return details();
  return support();
}

/* ---------- pages ---------- */
function home(){
  return '<h1>Pet City!🦄</h1><p class="lead">Welcome to the Pet City value list! This site is dedicated to any players who are clueless about values. As values evolve through stocking and demand, many players get confused with what certain items are worth. For this reason, a value site was put in place. If you have any questions or need help, please head to the Support page. If not, feel free to explore our values. We hope you become the next Pet Citian nerd!</p>'
   +'<div class="box">'+PAGES.map(function(p){return '<button class="big" data-a="go" data-p="'+p[0]+'">'+p[1]+'</button>'}).join('')+'</div>';
}
function typeBtns(t,act){return '<div class="types">'+TYPES.map(function(x){return '<button class="t-'+x[0]+(t[x[0]]?' on':'')+'" data-a="'+act+'" data-k="'+x[0]+'" aria-pressed="'+(!!t[x[0]])+'" aria-label="'+({F:'Fly',R:'Ride',G:'Ghost',N:'Normal',S:'Shiny',Z:'Rainbow'}[x[0]])+'">'+x[1]+'</button>'}).join('')+'</div>'}
function modeSeg(){return '<div class="seg" role="group" aria-label="Value mode">'+MODES.map(function(m){return '<button data-a="mode" data-m="'+m[0]+'" class="'+(st.mode===m[0]?'on':'')+'">'+m[1]+'</button>'}).join('')+'</div>'}
function sideTotal(arr){var s=0;arr.forEach(function(e){var it=item(e.id);if(it)s+=valueOf(it,vk(kindOf(e.t),e.t.G,e.t.F,e.t.R),st.mode)*e.q});return s}
function slots(side){
  var arr=calc[side].filter(function(e){return item(e.id)}),h='',n=0;
  arr.forEach(function(e,i){var it=item(e.id),v=variant(it,vk(kindOf(e.t),e.t.G,e.t.F,e.t.R));
    for(var j=0;j<e.q&&n<9;j++,n++)
      h+='<button class="slot" style="border-color:var(--'+it.rar.toLowerCase()+')" data-a="rm" data-s="'+side+'" data-i="'+i+'" aria-label="Remove one '+esc(it.name)+'">'+imgHtml(it)+'<span class="tg">'+tagsHtml(e.t)+'</span>'+(st.demand&&v.d?'<span class="dm">'+esc(v.d)+'</span>':'')+'</button>'});
  if(n<9)h+='<button class="slot plus" data-a="add" data-s="'+side+'" aria-label="Add item">+</button>';
  for(var k=n+1;k<9;k++)h+='<div class="slot"></div>';
  return h;
}
function calculator(){
  calc.you=calc.you.filter(function(e){return item(e.id)});calc.them=calc.them.filter(function(e){return item(e.id)});
  var y=sideTotal(calc.you),t=sideTotal(calc.them),d=t-y,cls=d>0?'win':d<0?'lose':'fair',lab=d>0?'WIN':d<0?'LOSE':'FAIR';
  return '<h1>Calculator⚖️</h1><div class="box calc"><div class="row" style="justify-content:space-between;flex-wrap:nowrap"><span style="width:38px"></span><div class="verdict" style="margin:0">'+lab+'</div><button class="gear" data-a="settings" aria-label="Settings">⚙</button></div>'
   +'<div class="tot '+cls+'" style="margin-top:8px"><span>'+fmt(y)+'</span><span>'+(d>0?'+':'')+fmt(d)+'</span><span>'+fmt(t)+'</span></div>'
   +'<div class="sides"><div><h3>YOU</h3><div class="grid3">'+slots('you')+'</div></div><button class="swap" data-a="swap" aria-label="Swap sides">⇄</button><div><h3>THEM</h3><div class="grid3">'+slots('them')+'</div></div></div></div>'
   +'<p class="sec-note" style="margin-top:12px">Values come from the Value List ('+MODES.filter(function(m){return m[0]===st.mode})[0][1]+').</p>';
}
function matches(it){
  var q=vl.q.trim().toLowerCase();
  if(q&&String(it.name).toLowerCase().indexOf(q)<0)return false;
  if(vl.cat!=='All Categories'&&it.cat!==vl.cat)return false;
  if(vl.rar!=='All'&&it.rar!==vl.rar)return false;
  return true;
}
function cardHtml(it){
  var s=sel[it.id]||(sel[it.id]={k:'N',g:false,f:false,r:false}),v=variant(it,vk(s.k,s.g,s.f,s.r)),pet=it.cat==='Pets',dv=devOn();
  var val=shownValue(it,vk(s.k,s.g,s.f,s.r),st.mode);
  return '<div class="card '+esc(it.rar)+(dv?' dev':'')+'" data-a="'+(dv?'edit':'noop')+'" data-id="'+it.id+'">'
   +(dv?'<button class="trash" data-a="del" data-id="'+it.id+'" aria-label="Delete '+esc(it.name)+'">🗑</button>':'')
   +'<div class="im">'+imgHtml(it)+'</div><div class="nm">'+esc(it.name)+'</div>'
   +'<div class="vl">Value: '+esc(val==null?'':val)+'</div><div class="vl">Demand: '+esc(v.d||'')+'</div>'
   +(pet?'<div class="mini">'+[['vn','Normal',s.k==='N'],['vs','Shiny',s.k==='S'],['vz','Rainbow',s.k==='Z'],['vg','Ghost',s.g],['vr','Ride',s.r],['vf','Fly',s.f]].map(function(x){return '<button data-a="'+x[0]+'" data-id="'+it.id+'" class="'+(x[2]?'on':'')+'">'+x[1]+'</button>'}).join('')+'</div>':'')
   +'</div>';
}
function listHtml(){
  var h='',any=false;
  CATS.forEach(function(c){
    if(vl.cat!=='All Categories'&&vl.cat!==c)return;
    var its=sorted(data.items.filter(function(i){return i.cat===c&&matches(i)}));
    h+='<h2>'+c+'</h2>'+(its.length?'<div class="cards">'+its.map(cardHtml).join('')+'</div>':'<p class="sec-note">Nothing listed yet.</p>');
    if(its.length)any=true;
  });
  if(devOn())h+='<div class="cards" style="margin-top:6px"><div class="card add" data-a="new" role="button" aria-label="Add a listing">+</div></div>';
  return h;
}
function valueList(){
  return '<h1>Value List💎</h1><div class="search"><span aria-hidden="true">🔍</span><input id="q" type="search" placeholder="Search items..." value="'+esc(vl.q)+'" autocomplete="off"></div>'
   +'<div class="row" style="margin-top:10px"><button class="chip'+(vl.filters?' on':'')+'" data-a="filters">☰ Filters</button>'+modeSeg()+'</div>'
   +(vl.filters?'<div class="box filters">'+['All Categories'].concat(CATS).map(function(c){return '<button class="chip'+(vl.cat===c?' on':'')+'" data-a="cat" data-c="'+c+'">'+c+'</button>'}).join('')+'</div>':'')
   +'<div style="margin-top:10px"><div class="seg" role="group" aria-label="Rarity">'+['All'].concat(RARS).map(function(r){return '<button data-a="rar" data-r="'+r+'" class="'+(vl.rar===r?'on':'')+'">'+r+'</button>'}).join('')+'</div></div>'
   +'<div id="list">'+listHtml()+'</div>';
}
function details(){
  var h='<h1>Details📩</h1>';
  data.details.forEach(function(d,i){
    h+='<div class="box info" style="position:relative"><h3>'+esc(d.h)+'</h3><p>'+esc(d.t)+'</p>'+(devOn()?'<div class="row" style="justify-content:center;margin-top:8px"><button class="btn alt" style="padding:4px 10px;font-size:12px" data-a="editdet" data-i="'+i+'">Edit</button><button class="btn alt" style="padding:4px 10px;font-size:12px" data-a="deldet" data-i="'+i+'">Delete</button></div>':'')+'</div>';
  });

  return h;
}
function support(){
  return '<h1>Support🛠️</h1><div class="box info"><h3>Questions</h3><p>For any questions about the values, please reach out to USERNAME in Discord.</p></div>'
   +'<div class="box info"><h3>Reports</h3><p>Please visit the following Discord server below to notify the game staff of any reports you may have.<br><a href="'+DISCORD+'" target="_blank" rel="noopener" style="color:#8ab4ff">'+DISCORD+'</a></p></div>';
}

/* ---------- modals ---------- */
function addGrid(){
  var m=modal,q=(m.q||'').trim().toLowerCase();
  var list=sorted(data.items.filter(function(i){return i.cat===m.cat&&(!q||String(i.name).toLowerCase().indexOf(q)>=0)}));
  
  var vis=list;
  return (vis.length?'<div class="pick">'+vis.map(function(i){return '<button class="pk '+esc(i.rar)+'" data-a="choose" data-id="'+i.id+'">'+imgHtml(i)+'<span>'+esc(i.name)+'</span></button>'}).join('')+'</div>':'<p class="sec-note" style="margin-top:20px">No items listed yet.</p>')
   +'';
}
function selectHtml(opts,val){return opts.map(function(o){return '<option'+(o===val?' selected':'')+'>'+o+'</option>'}).join('')}
function modalHtml(){
  var m=modal;if(!m)return '';
  if(m.type==='add')return '<div class="ov"><div class="mod"><h3>Add Items to Calculate</h3><div class="row" style="flex-wrap:nowrap"><div class="search" style="flex:1"><span aria-hidden="true">🔍</span><input id="aq" placeholder="Enter Search..." value="'+esc(m.q||'')+'" autocomplete="off"></div><button class="x" data-a="close" aria-label="Close">✕</button></div>'
    +'<div class="shop"><div class="cats">'+CATS.map(function(c){return '<button data-a="mcat" data-c="'+c+'" class="'+(m.cat===c?'on':'')+'">'+c+'</button>'}).join('')+'</div><div id="agrid">'+addGrid()+'</div></div></div></div>';
  if(m.type==='pick'){var it=item(m.id);return '<div class="ov"><div class="mod" style="text-align:center"><button class="x" data-a="close" style="position:absolute;right:12px;top:12px" aria-label="Close">✕</button><div style="width:110px;height:110px;margin:6px auto;display:grid;place-items:center">'+(it.img?'<img style="width:100%;height:100%;object-fit:contain" alt="" src="'+esc(it.img)+'">':imgHtml(it))+'</div><h3 style="font-size:24px;margin-bottom:0">'+esc(it.name)+'</h3>'+(it.cat==='Pets'?typeBtns(m.t,'ptype'):'<div style="height:12px"></div>')
    +'<input class="qty" id="pq" type="number" min="1" max="'+(9-used(m.side))+'" value="'+Math.min(m.q,9-used(m.side))+'" aria-label="Quantity"><div style="margin-top:14px"><button class="btn" data-a="select" style="background:#111;padding:10px 40px">Select</button></div></div></div>';}
  if(m.type==='settings')return '<div class="ov"><div class="mod"><button class="x" data-a="close" style="position:absolute;right:12px;top:12px" aria-label="Close">✕</button><h3>Default Pet Type</h3>'+typeBtns(st.def,'dtype')
    +'<div class="sw"><span>Show Demand</span><button class="tgl'+(st.demand?' on':'')+'" data-a="demand" role="switch" aria-checked="'+st.demand+'" aria-label="Show demand"></button></div><div class="sw" style="flex-direction:column;gap:8px"><span>Value Mode</span>'+modeSeg()+'</div></div></div>';
  if(m.type==='mult'){var nm=MODES.filter(function(x){return x[0]===m.m})[0][1];return '<div class="ov"><div class="mod"><h3>'+nm+' multiplier</h3><p class="sec-note">'+nm+' value = Baseless value × this number.</p><div class="f"><label for="mx">Multiplier</label><input id="mx" inputmode="decimal" value="'+esc(mult(m.m))+'"></div><div class="acts"><button class="btn alt" data-a="close">Cancel</button><button class="btn" data-a="savemult">Save</button></div></div></div>';}
  if(m.type==='new')return '<div class="ov"><div class="mod"><h3>New listing</h3><div class="f"><label for="nc">Category</label><select id="nc">'+selectHtml(CATS,m.cat)+'</select></div><div class="f"><label for="nr">Rarity</label><select id="nr">'+selectHtml(RARS,m.rar)+'</select></div><div class="acts"><button class="btn alt" data-a="close">Cancel</button><button class="btn" data-a="create">Continue</button></div></div></div>';
  if(m.type==='edit'){var e=m.tmp,v=(e.v[m.key]=e.v[m.key]||{});return '<div class="ov"><div class="mod"><h3>Edit listing</h3>'
    +'<div class="f"><label for="en">Name</label><input id="en" value="'+esc(e.name)+'"></div>'
    +'<div class="f"><label for="ei">Image</label><input id="ei" type="file" accept="image/*"><div style="width:64px;height:64px;display:grid;place-items:center;background:#16171a;border-radius:8px" id="eprev">'+imgHtml(e)+'</div></div>'
    +'<div class="two"><div class="f"><label for="ec">Category</label><select id="ec">'+selectHtml(CATS,e.cat)+'</select></div><div class="f"><label for="er">Rarity</label><select id="er">'+selectHtml(RARS,e.rar)+'</select></div></div>'
    +(e.cat==='Pets'?'<div class="f"><label>Variant being edited</label><div class="mini" style="grid-template-columns:repeat(3,1fr);gap:4px">'+[['n','Normal',m.key[0]==='N'],['s','Shiny',m.key[0]==='S'],['z','Rainbow',m.key[0]==='Z'],['g','Ghost',m.key.indexOf('G')>0],['r','Ride',m.key.indexOf('R')>0],['f','Fly',m.key.indexOf('F')>0]].map(function(x){return '<button style="padding:7px 0;font-size:12px" data-a="ev" data-x="'+x[0]+'" class="'+(x[2]?'on':'')+'">'+x[1]+'</button>'}).join('')+'</div></div>':'')
    +'<div class="f"><label for="vb">Value (Baseless)</label><input id="vb" inputmode="decimal" value="'+esc(v.b||'')+'"></div>'
    +'<div class="f"><label for="vd">Demand</label><input id="vd" value="'+esc(v.d||'')+'"></div><div class="acts"><button class="btn alt" data-a="close">Cancel</button><button class="btn" data-a="saveedit">Save</button></div></div></div>';}
  if(m.type==='det')return '<div class="ov"><div class="mod"><h3>Description</h3><div class="f"><label for="dh">Header</label><input id="dh" value="'+esc(m.h)+'"></div><div class="f"><label for="dt">Text</label><textarea id="dt">'+esc(m.t)+'</textarea></div><div class="acts"><button class="btn alt" data-a="close">Cancel</button><button class="btn" data-a="savedet">Save</button></div></div></div>';
  return '';
}
function setModal(m){modal=m;document.getElementById('modal').innerHTML=modalHtml()}
function readEd(){var m=modal;if(!m||m.type!=='edit')return;var g=function(i){return document.getElementById(i)};var e=m.tmp;e.name=g('en').value;e.cat=g('ec').value;e.rar=g('er').value;var v=(e.v[m.key]=e.v[m.key]||{});v.b=g('vb').value.trim();v.d=g('vd').value.trim()}
function fileToDataUrl(file,max){return new Promise(function(res){var fr=new FileReader();fr.onload=function(){var im=new Image();im.onload=function(){var s=Math.min(1,max/Math.max(im.width,im.height));var c=document.createElement('canvas');c.width=Math.max(1,Math.round(im.width*s));c.height=Math.max(1,Math.round(im.height*s));c.getContext('2d').drawImage(im,0,0,c.width,c.height);res(c.toDataURL('image/png'))};im.onerror=function(){res(null)};im.src=fr.result};fr.onerror=function(){res(null)};fr.readAsDataURL(file)})}

/* ---------- actions ---------- */
function saveSt(){st.v=2;ls('pc-st',st);ls('pc-calc',calc)}
function refreshView(){var v=document.getElementById('view');if(v)v.innerHTML=view();var d=document.querySelector('.devbar');if(d)d.outerHTML=devbar()}
var A={
 menu:function(){menuOpen=!menuOpen;render()},
 go:function(t){if(t.dataset.p===page)return;page=t.dataset.p;menuOpen=false;render();window.scrollTo(0,0)},
 mode:function(t){st.mode=t.dataset.m;saveSt();if(modal&&modal.type==='settings')setModal(modal);refreshView();if(devOn()&&page==='value-list'&&!modal)setModal({type:'mult',m:st.mode})},
 savemult:function(){var x=parseFloat(document.getElementById('mx').value);if(isNaN(x)||x<0){toast('Enter a number, 0 or higher.');return}data=clone(data);data.mult=data.mult||{};data.mult[modal.m]=x;touch();modal=null;refreshAll()},
 filters:function(){vl.filters=!vl.filters;refreshView()},
 cat:function(t){vl.cat=t.dataset.c;refreshView()},
 rar:function(t){vl.rar=t.dataset.r;refreshView()},
 vn:function(t){sel[t.dataset.id].k='N';refreshView()},
 vs:function(t){sel[t.dataset.id].k='S';refreshView()},
 vz:function(t){sel[t.dataset.id].k='Z';refreshView()},
 vg:function(t){var s=sel[t.dataset.id];s.g=!s.g;refreshView()},
 vr:function(t){var s=sel[t.dataset.id];s.r=!s.r;refreshView()},
 vf:function(t){var s=sel[t.dataset.id];s.f=!s.f;refreshView()},
 settings:function(){setModal({type:'settings'})},
 demand:function(){st.demand=!st.demand;saveSt();setModal(modal);refreshView()},
 dtype:function(t){var k=t.dataset.k;if(k==='N'||k==='S'||k==='Z')pickKind(st.def,k);else st.def[k]=!st.def[k];saveSt();setModal(modal)},
 add:function(t){setModal({type:'add',side:t.dataset.s,cat:'Pets',q:'',page:1})},
 mcat:function(t){modal.cat=t.dataset.c;modal.page=1;setModal(modal)},
 pg:function(t){modal.page=Math.max(1,modal.page+Number(t.dataset.d));document.getElementById('agrid').innerHTML=addGrid()},
 choose:function(t){var it=item(t.dataset.id);setModal({type:'pick',id:it.id,side:modal.side,t:Object.assign({},st.def),q:1})},
 ptype:function(t){var k=t.dataset.k;if(k==='N'||k==='S'||k==='Z')pickKind(modal.t,k);else modal.t[k]=!modal.t[k];var q=document.getElementById('pq');if(q)modal.q=Math.max(1,parseInt(q.value)||1);setModal(modal)},
 select:function(){var q=Math.max(1,Math.min(9-used(modal.side),parseInt(document.getElementById('pq').value)||1));var it=item(modal.id);var t=it.cat==='Pets'?modal.t:{F:false,R:false,G:false,N:true,S:false,Z:false};calc[modal.side].push({id:modal.id,t:Object.assign({},t),q:q});saveSt();modal=null;refreshAll()},
 rm:function(t){var a=calc[t.dataset.s].filter(function(e){return item(e.id)});var e=a[Number(t.dataset.i)];if(e){e.q--;if(e.q<1)a.splice(Number(t.dataset.i),1)}calc[t.dataset.s]=a;saveSt();refreshView()},
 swap:function(){var x=calc.you;calc.you=calc.them;calc.them=x;saveSt();refreshView()},
 close:function(){modal=null;refreshAll()},
 preview:function(){preview=!preview;refreshAll()},
 discard:function(){data=published;dirty=false;ls('pc-draft',null);refreshAll()},
 publish:function(){doPublish()},
 new:function(){setModal({type:'new',cat:'Pets',rar:'Common'})},
 create:function(){var it={id:uid(),name:'',cat:document.getElementById('nc').value,rar:document.getElementById('nr').value,img:'',v:{}};openEdit(it,true)},
 edit:function(t){if(!devOn())return;var it=item(t.dataset.id);if(it)openEdit(JSON.parse(JSON.stringify(it)),false)},
 del:function(t){var id=t.dataset.id;if(t.dataset.sure!=='1'){t.dataset.sure='1';t.textContent='Delete?';t.style.width='auto';t.style.padding='0 5px';setTimeout(function(){if(t.isConnected){t.dataset.sure='';t.textContent='🗑';t.style.width='';t.style.padding=''}},2500);return}data=clone(data);data.items=data.items.filter(function(i){return i.id!==id});touch();refreshAll()},
 ecat:function(){readEd();modal.key='N';setModal(modal)},
 ev:function(t){readEd();var k=modal.key,x=t.dataset.x,kd=k[0],g=k.indexOf('G')>0,f=k.indexOf('F')>0,r=k.indexOf('R')>0;if(x==='n'||x==='s'||x==='z')kd=x.toUpperCase();if(x==='g')g=!g;if(x==='r')r=!r;if(x==='f')f=!f;modal.key=vk(kd,g,f,r);setModal(modal)},
 saveedit:function(){readEd();var e=modal.tmp;if(!e.name.trim()){toast('Enter a name first.');return}e.name=e.name.trim();if(e.cat!=='Pets'){var n=e.v.N||{};e.v={N:n}}var i=data.items.findIndex(function(x){return x.id===e.id});data=clone(data);if(i>=0)data.items[i]=e;else data.items.push(e);touch();modal=null;refreshAll()},
 adddet:function(){setModal({type:'det',i:-1,h:'',t:''})},
 editdet:function(t){var i=Number(t.dataset.i),d=data.details[i];setModal({type:'det',i:i,h:d.h,t:d.t})},
 deldet:function(t){data=clone(data);data.details.splice(Number(t.dataset.i),1);touch();refreshAll()},
 savedet:function(){var h=document.getElementById('dh').value.trim(),tx=document.getElementById('dt').value.trim();if(!h){toast('Enter a header first.');return}data=clone(data);var d={h:h,t:tx};if(modal.i<0)data.details.push(d);else data.details[modal.i]=d;touch();modal=null;refreshAll()},
 noop:function(){}
};
function clone(o){return JSON.parse(JSON.stringify(o))}
function openEdit(it,isNew){data=clone(data);modal={type:'edit',tmp:it,key:'N',isNew:isNew};if(!it.v)it.v={};render()}
function refreshAll(){render()}

root.addEventListener('click',function(e){
  var t=e.target.closest('[data-a]');if(!t)return;
  var a=t.dataset.a;
  if(a==='noop'&&e.target.closest('button'))return;
  if(A[a]){if(a==='edit'&&e.target.closest('button'))return;A[a](t)}
});
root.addEventListener('input',function(e){
  var id=e.target.id;
  if(id==='q'){vl.q=e.target.value;document.getElementById('list').innerHTML=listHtml()}
  if(id==='aq'){modal.q=e.target.value;modal.page=1;document.getElementById('agrid').innerHTML=addGrid()}
  if(id==='pq'&&modal)modal.q=parseInt(e.target.value)||1;
});
root.addEventListener('change',function(e){
  var id=e.target.id;
  if(id==='ec'){A.ecat()}
  if(id==='ei'&&e.target.files[0]){var f=e.target.files[0];fileToDataUrl(f,160).then(function(u){if(!u){toast('That image could not be read.');return}modal.tmp.img=u;document.getElementById('eprev').innerHTML=imgHtml(modal.tmp)})}
});
document.addEventListener('keydown',function(e){if(e.key==='Escape'){if(modal){modal=null;refreshAll()}else if(menuOpen){menuOpen=false;render()}}});

/* ---------- publish ---------- */
function buildDoc(){
  var css=document.getElementById('app-style').textContent;
  var js=document.getElementById('app-script').textContent;
  var json=JSON.stringify(data).replace(/</g,'\\u003c');
  var S='scr'+'ipt';
  var reset=':root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}';
  return '<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>'+reset+'</style></head><body>'
   +'<title>Pet City</title>\n<meta name="claude:viewport-fit-sides" content="cover">\n<style id="app-style">'+css+'</style>\n'
   +'<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=DM+Sans:wght@400;500;600;700&display=swap">\n<div id="root"></div>\n'
   +'<'+S+' type="application/json" id="app-data">'+json+'</'+S+'>\n<'+S+' id="app-script">'+js+'</'+S+'></body></html>';
}
async function doPublish(){
  try{
    var a=window.claude&&await claude.use('artifact');
    if(!a){toast('Publishing is not available in this view.');return}
    toast('Publishing…');
    await a.publish(buildDoc());
    ls('pc-draft',null);
  }catch(err){toast(err&&err.code==='conflict'?'Someone published first. Reloading.':'Could not publish: '+((err&&err.message)||'unknown error'))}
}

/* ---------- boot ---------- */
var s0=ls('pc-st');if(s0){st.mode=s0.mode||'b';if(s0.v===2)st.def=Object.assign(st.def,s0.def||{});st.demand=s0.demand!==false;if(st.def.S||st.def.Z)st.def.N=false;if(st.def.S&&st.def.Z)st.def.Z=false}
var c0=ls('pc-calc');if(c0){calc.you=c0.you||[];calc.them=c0.them||[]}
render();
(async function(){
  try{
    var u=window.claude&&await claude.use('user');
    isOwner=!!(u&&await u.isOwner());
    if(isOwner){var d=ls('pc-draft');if(d&&d.items&&d.details){data=migrate(d);dirty=true}}
    render();
  }catch(e){}
})();
})();
</script>
